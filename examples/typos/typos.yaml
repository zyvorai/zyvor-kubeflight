# Field typos and type mistakes caught offline by KF-FLD-001/002 (plus an API removed in 1.25).
apiVersion: apps/v1
kind: Deployment
metadata: {name: typo, namespace: demo}
spec:
  replica: 3
  selector: {matchLabels: {app: typo}}
  template:
    metadata: {labels: {app: typo}}
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports: [{containerport: 80}]
          env: [{name: PORT, value: 8080}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: cfg, namespace: demo}
data: {retries: 3}
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata: {name: typo, namespace: demo}
spec: {minAvailable: 1, selector: {matchLabels: {app: typo}}}
