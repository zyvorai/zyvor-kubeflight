[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeflight"
version = "0.2.0"
description = "Know what will break before you deploy to Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "LicenseRef-Zyvor-Production-2.0"}
authors = [{name = "Zyvor AI Labs"}]
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "PyYAML==6.0.4",
]

[project.scripts]
kubeflight = "kubeflight.cli:main"

[tool.setuptools]
packages = ["kubeflight"]
include-package-data = true

[tool.setuptools.package-data]
kubeflight = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
